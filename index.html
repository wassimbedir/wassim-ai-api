<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>وسيم AI</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#080808;
--panel:#101010;
--border:#272727;
--text:#f5f5f5;
--gold:#d4af37;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,Tahoma,sans-serif;
height:100vh;
overflow:hidden;
}

.app{
height:100vh;
display:flex;
}

.sidebar{
width:280px;
background:#0d0d0d;
border-left:1px solid var(--border);
display:flex;
flex-direction:column;
padding:16px;
}

.new-chat{
width:100%;
padding:13px 16px;
border:1px solid #333;
border-radius:13px;
background:#151515;
color:white;
font-size:14px;
cursor:pointer;
text-align:right;
}

.sidebar-title{
margin:25px 5px 10px;
color:#666;
font-size:12px;
}

.history{
flex:1;
overflow-y:auto;
}

.history-item{
padding:11px;
border-radius:10px;
color:#bbb;
font-size:13px;
cursor:pointer;
margin-bottom:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.history-item:hover{
background:#181818;
color:white;
}

.sidebar-footer{
border-top:1px solid #222;
padding-top:14px;
color:#777;
font-size:11px;
text-align:center;
}

.main{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
}

.header{
height:66px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid var(--border);
background:#0c0c0c;
}

.brand{
display:flex;
align-items:center;
gap:11px;
}
 
.logo{
width:40px;
height:40px;
border-radius:13px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.brand-name{
font-size:18px;
font-weight:bold;
}

.status{
display:flex;
align-items:center;
gap:6px;
margin-top:3px;
color:#777;
font-size:10px;
}

.dot{
width:6px;
height:6px;
border-radius:50%;
background:#5d9b64;
}

.menu{
display:none;
background:none;
border:0;
color:#aaa;
font-size:24px;
cursor:pointer;
}

.chat{
flex:1;
overflow-y:auto;
padding:35px 18px 150px;
scroll-behavior:smooth;
}

.chat-inner{
max-width:850px;
margin:auto;
}

.welcome{
min-height:55vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.big-logo{
width:82px;
height:82px;
border-radius:25px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 45px rgba(212,175,55,.10);
}

.big-logo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}
.welcome h1{
margin-top:22px;
font-size:30px;
}

.welcome p{
max-width:480px;
margin-top:12px;
line-height:1.9;
color:#888;
font-size:14px;
}

.suggestions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
width:min(650px,100%);
margin-top:28px;
}

.suggestion{
background:#111;
border:1px solid #242424;
color:#bbb;
padding:13px;
border-radius:13px;
cursor:pointer;
text-align:right;
font-size:12px;
}

.message{
display:flex;
margin-bottom:22px;
animation:appear .2s ease;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(5px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.message.user{
justify-content:flex-start;
}

.message.ai{
justify-content:flex-end;
}

.bubble{
max-width:78%;
padding:13px 16px;
border-radius:17px;
line-height:1.85;
white-space:pre-wrap;
word-break:break-word;
font-size:14px;
}

.user .bubble{
background:#1d1d1d;
border-bottom-right-radius:5px;
}

.ai .bubble{
background:#101010;
border:1px solid #252525;
border-bottom-left-radius:5px;
}

.typing{
display:flex;
align-items:center;
gap:5px;
}

.typing span{
width:6px;
height:6px;
border-radius:50%;
background:#777;
animation:bounce 1s infinite;
}

.typing span:nth-child(2){
animation-delay:.15s;
}

.typing span:nth-child(3){
animation-delay:.3s;
}

@keyframes bounce{
0%,60%,100%{
transform:translateY(0);
}
30%{
transform:translateY(-5px);
}
}

.input-area{
position:fixed;
bottom:0;
left:280px;
right:0;
padding:15px 18px 20px;
background:linear-gradient(transparent,#080808 28%);
}

.input-wrap{
max-width:850px;
margin:auto;
}

.input-box{
display:flex;
align-items:flex-end;
gap:8px;
background:#111;
border:1px solid #292929;
border-radius:20px;
padding:8px;
box-shadow:0 -5px 30px rgba(0,0,0,.25);
}

textarea{
flex:1;
min-height:43px;
max-height:140px;
resize:none;
border:0;
outline:0;
background:transparent;
color:white;
font-family:inherit;
font-size:14px;
line-height:1.6;
padding:10px 9px;
}

textarea::placeholder{
color:#666;
}

.send{
width:43px;
height:43px;
flex-shrink:0;
border:0;
border-radius:13px;
background:var(--gold);
color:#080808;
font-size:19px;
cursor:pointer;
}

.send:disabled{
opacity:.35;
cursor:not-allowed;
}

.hint{
text-align:center;
color:#555;
font-size:9px;
margin-top:7px;
}

@media(max-width:700px){

.sidebar{
position:fixed;
top:0;
bottom:0;
right:-290px;
z-index:20;
box-shadow:-10px 0 40px rgba(0,0,0,.5);
transition:.25s;
}

.sidebar.open{
right:0;
}

.menu{
display:block;
}

.input-area{
left:0;
}

.header{
padding:0 14px;
}

.chat{
padding:25px 12px 145px;
}

.welcome{
min-height:60vh;
}

.welcome h1{
font-size:25px;
}

.big-logo{
width:72px;
height:72px;
font-size:29px;
}

.suggestions{
grid-template-columns:1fr;
}

.bubble{
max-width:90%;
}
/* ===== تحسينات وسيم AI ===== */

.suggestion{
transition:
transform .18s ease,
background .18s ease,
border-color .18s ease,
color .18s ease;
}

.suggestion:hover{
transform:translateY(-2px);
background:#171717;
border-color:#3a3a3a;
color:#fff;
}

.suggestion:active{
transform:scale(.98);
}

.send{
transition:
transform .15s ease,
opacity .2s ease,
box-shadow .2s ease;
}

.send:hover:not(:disabled){
transform:scale(1.05);
box-shadow:0 0 20px rgba(212,175,55,.18);
}

.send:active:not(:disabled){
transform:scale(.94);
}

.input-box{
transition:
border-color .2s ease,
box-shadow .2s ease,
background .2s ease;
}

.input-box:focus-within{
border-color:#3a3a3a;
box-shadow:
0 0 0 1px rgba(212,175,55,.06),
0 -5px 30px rgba(0,0,0,.3);
}

.bubble{
transition:transform .18s ease;
}

.message{
animation:messageIn .28s cubic-bezier(.2,.8,.2,1);
}

@keyframes messageIn{
from{
opacity:0;
transform:translateY(10px) scale(.98);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.typing span{
animation:bounce 1.1s infinite ease-in-out;
}

@media(max-width:700px){

.suggestion{
padding:14px;
}

.bubble{
font-size:14px;
line-height:1.9;
}

.input-box{
border-radius:18px;
}

}
/* ===== Smooth Chat ===== */

.chat{
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
}

.message{
animation:messageIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes messageIn{
0%{
opacity:0;
transform:translateY(12px) scale(.98);
}
100%{
opacity:1;
transform:translateY(0) scale(1);
}
}

.bubble{
transition:
background .2s ease,
border-color .2s ease,
transform .2s ease;
}

.user .bubble:hover,
.ai .bubble:hover{
transform:translateY(-1px);
}

.typing{
min-width:58px;
justify-content:center;
padding:15px 18px;
}

.typing span{
width:6px;
height:6px;
border-radius:50%;
animation:
typingBounce 1.2s infinite ease-in-out;
}

.typing span:nth-child(2){
animation-delay:.15s;
}

.typing span:nth-child(3){
animation-delay:.30s;
}

@keyframes typingBounce{
0%,60%,100%{
opacity:.35;
transform:translateY(0);
}
30%{
opacity:1;
transform:translateY(-5px);
}
}

textarea{
transition:
height .15s ease,
padding .15s ease;
}

.send{
transition:
transform .15s ease,
opacity .2s ease,
box-shadow .2s ease;
}

.send:hover:not(:disabled){
transform:scale(1.05);
box-shadow:0 0 18px rgba(212,175,55,.16);
}

.send:active:not(:disabled){
transform:scale(.94);
}

.suggestion{
transition:
transform .18s ease,
background .18s ease,
border-color .18s ease;
}

.suggestion:hover{
transform:translateY(-2px);
background:#181818;
border-color:#353535;
}

.suggestion:active{
transform:scale(.98);
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<button class="new-chat" id="newChat">
＋ محادثة جديدة
</button>

<div class="sidebar-title">
المحادثات
</div>

<div class="history" id="history"></div>

<div class="sidebar-footer">
وسيم AI · مساعدك الذكي 🤖
</div>

</aside>

<main class="main">

<header class="header">

<button class="menu" id="menu">
☰
</button>

<div class="brand">

<div class="logo">
<div class="logo">
    <img src="logo.jpg" alt="وسيم AI">
</div>
</div>

<div>

<div class="brand-name">
وسيم AI
</div>

<div class="status">
<span class="dot"></span>
جاهز للمساعدة
</div>

</div>

</div>

</header>

<section class="chat" id="chat">

<div class="chat-inner" id="chatInner">

<div class="welcome">

<div class="big-logo">
<img src="logo.jpg" alt="وسيم AI">
</div>

<h1>
مرحباً، أنا وسيم 🤖
</h1>

<p>
مساعدك الذكي.
أفهم السياق وأتكيّف مع طريقة حديثك
ونوع المهمة التي تريدها.
</p>

<div class="suggestions">

<button class="suggestion">
💡 أعطني فكرة جديدة
</button>

<button class="suggestion">
📚 ساعدني في الدراسة
</button>

<button class="suggestion">
💻 ساعدني في البرمجة
</button>

<button class="suggestion">
✍️ اكتب لي شيئاً إبداعياً
</button>

</div>

</div>

</div>

</section>

<div class="input-area">

<div class="input-wrap">

<div class="input-box">

<textarea
id="message"
rows="1"
placeholder="اكتب رسالتك إلى وسيم..."
></textarea>

<button
class="send"
id="send"
type="button"
>
➤
</button>

</div>

<div class="hint">
Enter للإرسال · Shift + Enter لسطر جديد
</div>

</div>

</div>

</main>

</div>

<script>
const API_URL = "https://wassim-ai-api.onrender.com/chat";

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const input = document.getElementById("message");
const send = document.getElementById("send");
const newChat = document.getElementById("newChat");
const history = document.getElementById("history");
const menu = document.getElementById("menu");
const sidebar = document.getElementById("sidebar");

let currentMessages = [];

let conversations = JSON.parse(
    localStorage.getItem("wasim_ai_conversations") || "[]"
);

function saveConversations(){

    localStorage.setItem(
        "wasim_ai_conversations",
        JSON.stringify(conversations)
    );

}

function renderHistory(){

    history.innerHTML = "";

    conversations.slice().reverse().forEach(
        (conversation,index)=>{

            const item = document.createElement("div");

            item.className = "history-item";

            item.textContent =
                conversation.title || "محادثة جديدة";

            item.addEventListener("click",()=>{

                loadConversation(
                    conversations.length - 1 - index
                );

                sidebar.classList.remove("open");

            });

            history.appendChild(item);

        }
    );

}

function startNewChat(){

    currentMessages = [];

    chatInner.innerHTML = `

        <div class="welcome">

            <div class="big-logo">
          <img src="logo.jpg" alt="وسيم AI">
           </div>

            <h1>
                مرحباً، أنا وسيم 🤖
            </h1>

            <p>
                محادثة جديدة جاهزة.
                واش حاب نديرو اليوم؟
            </p>

            <div class="suggestions">

                <button class="suggestion">
                    💡 أعطني فكرة جديدة
                </button>

                <button class="suggestion">
                    📚 ساعدني في الدراسة
                </button>

                <button class="suggestion">
                    💻 ساعدني في البرمجة
                </button>

                <button class="suggestion">
                    ✍️ اكتب لي شيئاً إبداعياً
                </button>

            </div>

        </div>

    `;

    input.value = "";

    input.style.height = "43px";

    input.focus();

}

function loadConversation(index){

    const conversation = conversations[index];

    if(!conversation) return;

    currentMessages =
        Array.isArray(conversation.messages)
        ? [...conversation.messages]
        : [];

    chatInner.innerHTML = "";

    currentMessages.forEach(message=>{

            message.content,
            message.role === "user"
                ? "user"
                : "ai"
        );

    });

}

	
function addMessage(text,type){

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chatInner.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;

}

function showTyping(){

    hideTyping();

    const message = document.createElement("div");

    message.className = "message ai";

    message.id = "typingMessage";

    message.innerHTML = `

        <div class="bubble typing">

            <span></span>
            <span></span>
            <span></span>

        </div>

    `;

    chatInner.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

}

function hideTyping(){

    const typing =
        document.getElementById("typingMessage");

    if(typing){

        typing.remove();

    }

}

function saveCurrentConversation(){

    if(currentMessages.length === 0){
        return;
    }

    const firstUser =
        currentMessages.find(
            message => message.role === "user"
        );

    const title =
        firstUser
        ? firstUser.content.slice(0,40)
        : "محادثة جديدة";

    if(conversations.length > 0){

        const last =
            conversations[conversations.length - 1];

        last.title = title;

        last.messages = [...currentMessages];

    }else{

        conversations.push({

            title:title,

            messages:[...currentMessages]

        });

    }

    saveConversations();

    renderHistory();

}

async function sendMessage(){

    const text = input.value.trim();

    if(!text || send.disabled){
        return;
    }

    addMessage(text,"user");

    currentMessages.push({

        role:"user",

        content:text

    });

    input.value = "";

    input.style.height = "43px";

    send.disabled = true;

    showTyping();

try{
    alert("وصل للإرسال 🚀");
        console.log("إرسال إلى:",API_URL);

        const response = await fetch(

            API_URL,

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    message:text,

                    messages:currentMessages

                })

            }

        );

        console.log(
            "API STATUS:",
            response.status
        );

        const data = await response.json();

        console.log(
            "API RESPONSE:",
            data
        );

        hideTyping();

        if(!response.ok){

            let errorText =
                "خطأ غير معروف";

            if(data){

                if(typeof data.error === "string"){

                    errorText = data.error;

                }else if(data.error){

                    errorText =
                        JSON.stringify(data.error);

                }

            }

            addMessage(
                "صار خطأ من الخادم 🤖\n\n" +
                errorText,
                "ai"
            );

            return;

        }

        
        if(data.reply){

            addMessage(
                data.reply,
                "ai"
            );

            currentMessages.push({

                role:"assistant",

                content:data.reply

            });

            saveCurrentConversation();

        }else{

            addMessage(
                "الخادم ما رجعش رد 🤖",
                "ai"
            );

        }

    }catch(error){

        hideTyping();

        console.error(
            "FETCH ERROR:",
            error
        );

        addMessage(

            "ما قدرتش نتصل بوسيم 😕\n\n" +
            "تأكد أن API شغال على 5001.",

            "ai"

        );

    }finally{

        send.disabled = false;

        input.focus();

    }

}

send.addEventListener(
    "click",
    sendMessage
);

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);

input.addEventListener(
    "input",
    function(){

        this.style.height = "43px";

        this.style.height =
            Math.min(
                this.scrollHeight,
                140
            ) + "px";

    }
);

newChat.addEventListener(
    "click",
    function(){

        startNewChat();

        sidebar.classList.remove("open");

    }
);

menu.addEventListener(
    "click",
    function(){

        sidebar.classList.toggle("open");

    }
);

document.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(".suggestion");

        if(!button){
            return;
        }

        input.value =
            button.textContent
                .replace(/^.{2}/,"")
                .trim();

        input.focus();

    }
);

renderHistory();

input.focus();

</script>

</body>
</html>
